name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r vanhornstays-site-part1/. _site/
          if [ -d "vanhornstays-site-part1 3" ]; then cp -r "vanhornstays-site-part1 3"/. _site/; fi
          if [ -d vanhornstays-overlay ]; then cp -r vanhornstays-overlay/. _site/; fi
          if [ -d img ]; then mkdir -p _site/img; cp -r img/. _site/img/; fi
          if [ -d vanhornstays-site-part2/img ]; then cp -r vanhornstays-site-part2/img/. _site/img/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
