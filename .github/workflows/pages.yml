name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r vanhornstays-site-part1/. _site/
          if [ -d "vanhornstays-site-part1 3" ]; then cp -r "vanhornstays-site-part1 3"/. _site/; fi
          for d in vanhornstays-overlay*; do if [ -d "$d" ]; then cp -r "$d"/. _site/; fi; done
          for d in vh-update*; do if [ -d "$d" ]; then cp -r "$d"/. _site/; fi; done
          if [ -d img ]; then mkdir -p _site/img; cp -r img/. _site/img/; fi
          if [ -d vanhornstays-site-part2/img ]; then cp -r vanhornstays-site-part2/img/. _site/img/; fi
          touch _site/.nojekyll
          ls -la _site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
